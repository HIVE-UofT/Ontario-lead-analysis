apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ontario-lead-analysis
  namespace: hivelab-static-webpage
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.alpha.kubernetes.io/target: "206.12.91.13"
spec:
  ingressClassName: nginx
  rules:
    - host: ontario-lead-analysis.fedlify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ontario-lead-analysis
                port:
                  number: 80

  tls:
    - hosts:
        - ontario-lead-analysis.fedlify.com
      secretName: ontario-lead-analysis-tls

